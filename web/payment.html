<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Details</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>Payment Details</h1>

    <!-- Navigation -->
    <div class="nav-buttons">
        <button type="button"
                onclick="window.location.href='add-entry.html'">
            ← Back
        </button>
    </div>

    <br>

    <!-- Search -->
    <input
        type="text"
        id="searchBox"
        placeholder="Search Customer Name..."
    >

    <br><br>

    <!-- Total Paid Amount -->
    <div class="card">
        <h3>Total Paid Amount</h3>
        <p id="totalPaid">0</p>
    </div>

    <hr>

    <!-- Payment Form -->
    <form id="paymentForm">

        <label for="paymentDate">Date</label>
        <input
            type="date"
            id="paymentDate"
            required>

        <label for="customerName">Customer Name</label>
        <input
            type="text"
            id="customerName"
            placeholder="Enter Customer Name"
            required>

        <label for="paymentMode">Mode Of Payment</label>
        <input
            list="paymentModes"
            id="paymentMode"
            placeholder="Select Payment Mode"
            required>

        <datalist id="paymentModes">
            <option value="Cash">
            <option value="UPI">
            <option value="Bank Transfer">
            <option value="Credit Card">
            <option value="Debit Card">
            <option value="Google Pay">
            <option value="PhonePe">
            <option value="Paytm">
        </datalist>

        <label for="amountGiven">Amount Given</label>
        <input
            type="number"
            id="amountGiven"
            placeholder="Enter Amount"
            required>

        <br><br>

        <button type="submit">
            Save Payment
        </button>

    </form>

    <hr>

    <!-- Payment Records -->
    <h2>Payment Records</h2>

    <table border="1" width="100%" id="paymentTable">

        <thead>
            <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>Mode</th>
                <th>Amount</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="paymentBody">
        </tbody>

    </table>

</div>

<script src="js/payment.js"></script>

</body>
</html>
